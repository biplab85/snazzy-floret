        - generic [ref=e67]:
          - generic [ref=e68]:
            - paragraph [ref=e69]: Mother-daughter dressing lives in a delicate space. Too matchy and it reads as a uniform. Too different and the “pair” quality is lost. These five pairings balance both sides cleanly.
            - heading "1. Ivory saree + soft-peach salwar kameez" [level=2] [ref=e70]
            - paragraph [ref=e71]: A timeless combination that works at weddings, Eids, and portrait sessions. Ivory reads elegant on the mother; the peach adds softness on the daughter without competing.
            - heading "2. Deep-teal angarkha + teal-and-gold kurti" [level=2] [ref=e72]
            - paragraph [ref=e73]: Same palette, different silhouettes. The angarkha’s length on the mother and the kurti’s clean lines on the daughter photograph beautifully together.
            - heading "3. Block-printed kurti sets in matching palette, different prints" [level=2] [ref=e74]
            - paragraph [ref=e75]: For casual family events or travel. Pick two kurtis from the same block-print family — the prints differ, but the colour palette ties them.
            - heading "4. White salwar + ice-blue dress" [level=2] [ref=e76]
            - paragraph [ref=e77]: Modern and minimal. The mother in white, the daughter in a soft pastel from the same cool-tone family. Add matching pearl or silver jewellery to tie the look.
            - heading "5. Terracotta saree + mustard kurti" [level=2] [ref=e78]
            - paragraph [ref=e79]: Warm tones for autumn shoots or Eid-ul-Azha. Rich, earthy, and photographs with incredible warmth against neutral backgrounds.
